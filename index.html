<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecdf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="弦上二胡手机练功房" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=10" />
    <title>弦上二胡 · Erhu Pocket Studio</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="./icon.svg" alt="" />
          <div class="brand-copy">
            <h1>弦上二胡</h1>
            <p>ERHU POCKET STUDIO</p>
          </div>
        </div>
        <button id="helpButton" class="help-button" type="button" aria-label="打开玩法说明">?</button>
      </header>

      <main class="game" aria-label="手机二胡模拟器">
        <section class="mode-row" aria-label="曲目和演奏模式">
          <label class="song-picker" for="songSelect">
            <span>曲目</span>
            <select id="songSelect" aria-label="选择练习曲目"></select>
            <i aria-hidden="true"></i>
          </label>
          <div class="mode-tabs">
            <button class="active" type="button" data-mode="practice" aria-pressed="true">跟谱练习</button>
            <button type="button" data-mode="free" aria-pressed="false">自由演奏</button>
          </div>
        </section>

        <section class="score-paper" aria-label="当前音符和成绩">
          <div class="current-block">
            <p id="pieceEyebrow">当前一音</p>
            <div class="current-note-row">
              <strong id="currentNote">D</strong>
              <span id="currentScale">1</span>
            </div>
            <b id="scoreBowDirection">拉弓 →</b>
          </div>

          <div class="stats" aria-label="当前成绩">
            <div><span>得分</span><b id="score">0000</b></div>
            <div><span>连击</span><b id="combo">×0</b></div>
          </div>

          <div id="noteLane" class="note-lane" aria-label="接下来的乐谱"></div>
          <span id="progressBar" class="hidden-state"></span>
          <span id="progressText" class="hidden-state"></span>
          <span id="songSubtitle" class="hidden-state"></span>
        </section>

        <section class="instrument-stage" aria-label="左手音位与二胡">
          <div class="instrument-left">
            <div class="stage-heading">左手・按弦选音</div>
            <div id="pitchGrid" class="pitch-grid"></div>
          </div>
          <div class="instrument-spacer" aria-hidden="true"></div>
          <div class="instrument-art" aria-hidden="true">
            <img class="erhu-image" src="./erhu-panel.png?v=10" alt="" />
          </div>
        </section>

        <section class="bow-section" aria-label="右手横向拖弓">
          <div class="bow-heading">右手・横向拖弓</div>
          <button id="bowPad" class="bow-pad target-pull" type="button" aria-label="按住并横向拖动琴弓">
            <span class="bow-copy bow-left">←&nbsp; 推弓</span>
            <span class="bow-track" aria-hidden="true"></span>
            <span class="bow-knob" aria-hidden="true"><i></i></span>
            <span class="bow-copy bow-right">拉弓&nbsp; →</span>
          </button>
          <span id="bowTitle" class="hidden-state"></span>
          <span id="bowBadge" class="hidden-state"></span>
        </section>

        <div class="hidden-state" aria-live="polite">
          <span id="feedbackDot"></span>
          <span id="feedback"></span>
          <span id="accuracy"></span>
        </div>
      </main>

      <footer class="practice-dock">
        <button id="resetButton" class="dock-side" type="button" aria-label="重新开始">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.7 15a7 7 0 1 0 .3-6.4L4 10" /></svg>
          <span>重来</span>
        </button>
        <button id="startButton" class="start-button" type="button">
          <span class="play-icon" aria-hidden="true"></span>
          <span id="startButtonText">开始练习</span>
        </button>
        <button id="soundButton" class="dock-side" type="button" aria-pressed="false" aria-label="关闭声音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12" /></svg>
          <span>声音</span>
        </button>
      </footer>
    </div>

    <dialog id="guideDialog" class="paper-dialog">
      <p>三步上手</p>
      <h2>一只手选音，一只手拉弓</h2>
      <ol>
        <li><b>点音位</b><span>先从八张音位卡里选音。</span></li>
        <li><b>看弓向</b><span>看当前音提示向左推或向右拉。</span></li>
        <li><b>横向拖动</b><span>在弓区按住并横向滑动。</span></li>
      </ol>
      <button id="enterButton" class="dialog-button" type="button">进入练功房</button>
    </dialog>

    <dialog id="resultDialog" class="paper-dialog result-dialog">
      <p>本曲完成</p>
      <h2 id="resultTitle">稳稳拉完《小星星》</h2>
      <div class="result-stats">
        <div><span>得分</span><b id="resultScore">1400</b></div>
        <div><span>准确率</span><b id="resultAccuracy">100%</b></div>
        <div><span>最高连击</span><b id="resultCombo">14</b></div>
      </div>
      <div class="result-actions">
        <button id="resultFreeButton" type="button">自由拉一会儿</button>
        <button id="resultReplayButton" class="dialog-button" type="button">再奏一遍</button>
      </div>
    </dialog>

    <script type="module" src="./game.js?v=10"></script>
  </body>
</html>
